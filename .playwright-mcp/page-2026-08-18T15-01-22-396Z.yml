          - heading "Human-AI intelligence with telco infrastructure for CX delight" [level=2] [ref=f2e361]
          - generic [ref=f2e362]: Exotel runs AI agents, contact center, and streaming infrastructure on one unified architecture built for scale, speed, and measurable efficiency
        - list [ref=f2e368]:
          - listitem [ref=f2e369] [cursor=pointer]:
            - paragraph [ref=f2e371]: Intelligence with AI & automation
            - paragraph [ref=f2e374]: AI resolves routine queries, augments agents in real time, and learns from every interaction - raising containment, cutting repeat contacts, and feeding insights back into the system.
            - generic [ref=f2e375]:
              - list [ref=f2e377]:
                - listitem [ref=f2e378]: Up to 75% containment rate with AI voice and chat agents
                - listitem [ref=f2e379]: 100% conversation analysis for quality, compliance, and coaching
                - listitem [ref=f2e380]: Frictionless escalation & hand-off to human teams
              - link "Learn More" [ref=f2e381]:
                - /url: /products/house-of-ai/
          - listitem [ref=f2e382] [cursor=pointer]:
            - paragraph [ref=f2e385]: Contact center built on AI-human harmony
            - paragraph [ref=f2e388]: Context, AI, and reliability in every conversation, so agents respond smarter and customers feel understood. AI handles the volume, agents handle the complex, and supervisors monitor live.
          - listitem [ref=f2e389] [cursor=pointer]:
            - paragraph [ref=f2e392]: Unified Communication Stack
            - paragraph [ref=f2e395]: Experience high reliability with 99.99% uptime for uninterrupted messaging and voice communication at scale, powered by easy-to-integrate APIs on a telecom-grade platform.
      - generic [ref=f2e396]:
        - heading "CX That Learns and Improves With Every Conversation" [level=2] [ref=f2e398]
        - list [ref=f2e412]:
          - listitem [ref=f2e413] [cursor=pointer]:
            - paragraph [ref=f2e415]: Personalization At Scale
            - paragraph [ref=f2e418]: Every conversation carries context – intent, sentiment, history – across bots, agents, and teams. Agents see a unified view across every channel and touchpoint. AI Agent Assist surfaces the right context and next-best action in real time, so every conversation feels personal.
          - listitem [ref=f2e419] [cursor=pointer]:
            - paragraph [ref=f2e422]: Automation With Human-in-the-Loop
            - paragraph [ref=f2e425]: AI handles up to 75% of routine queries. Humans step in when empathy or judgment matters. One agent can monitor multiple AI agent conversations and take over when needed. Every intervention trains the AI for next time.
          - listitem [ref=f2e426] [cursor=pointer]:
            - paragraph [ref=f2e429]: Observability That Drives Continuous Improvement
            - paragraph [ref=f2e432]: Analyse 100% of interactions for quality, compliance, and sentiment automatically. Supervisors get live dashboards and proactive alerts. Insights feed back into the system so performance compounds over time.
          - listitem [ref=f2e433] [cursor=pointer]:
            - paragraph [ref=f2e436]: "Kaizen: CX That Improves"
            - paragraph [ref=f2e439]: Every call is a learning moment. Insights from CQA feed back into AI agents, human agents, and workflows. What worked gets reinforced; what didn't gets fixed. Tomorrow's CX is better than today's, automatically.
